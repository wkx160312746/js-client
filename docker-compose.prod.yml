version: "3.8"

services:
  ratel-client:
    image: ratel-client:latest
    container_name: ratel-client-prod
    ports:
      - "80:8080"
    volumes:
      - nginx-logs:/var/log/nginx
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - RATEL_WS_URL=${RATEL_WS_URL:-}
      - RATEL_SERVER_HOST=${RATEL_SERVER_HOST:-ratel-be.youdomain.com}
      - RATEL_SERVER_PORT=${RATEL_SERVER_PORT:-443}
      - RATEL_SERVER_NAME=${RATEL_SERVER_NAME:-Nico}
      - RATEL_SERVER_VERSION=${RATEL_SERVER_VERSION:-v1.3.0}
      - RATEL_IS_DEVELOPMENT=${RATEL_IS_DEVELOPMENT:-false}
      - BACKEND_USE=${BACKEND_USE:-wss}
    networks:
      - ratel-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

volumes:
  nginx-logs:
    driver: local

networks:
  ratel-network:
    driver: bridge
